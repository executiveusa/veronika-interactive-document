name: Apply final reduced version

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-final-reduced-version.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply edits
        run: python .github/scripts/apply_reduced.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nwkids_funding_alignment_call_tracker_v2.html
          if git diff --cached --quiet; then
            echo "No content changes needed"
            exit 0
          fi
          git commit -m "chore: finalize reduced Veronika version"
          git push origin main

# bounded one-shot rerun
