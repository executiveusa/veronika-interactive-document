name: Reduce funding intro

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reduce-funding-intro.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reduction
        run: python .github/scripts/reduce_funding_intro.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: reduce funding alignment intro"
          git push origin main
