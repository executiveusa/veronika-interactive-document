name: Veronika Recovery Inspect
on:
  push:
    branches: [deploy-veronika-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: veronika-current-index
          path: index.html
          if-no-files-found: error
          retention-days: 1
