name: Fix Veronika reduction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-reduction file and reapply approved deletions
        shell: bash
        run: |
          git show d464318e2e6c69c6606d69848f5e85eec5a10b12:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def cut(text, required=True):
              global s
              n = s.count(text)
              if required and not n:
                  raise SystemExit(f'Missing: {text[:100]}')
              s = s.replace(text, '')

          # Visible copy: deletion only.
          cut(" or feeling like somebody's robot")
          cut(" I listed in the resources section at the end of this document")
          cut("Personal answer. I'm 47 now and 48 this year. ")
          cut("My time is all I have and I don't feel aligned with spending it using my skills to help build and grow a corporation whose primary goal is maximizing profits at any cost and views most of their employees as expendable and replaceable. ")
          cut("That fact is part of the reason I decided to do this project in the first place and not deal with being in the rat race or pursuing a traditional path. ")
          for x in [
              "On a positive note yesterday I met with my first potential client to see if I could get signal or if all of this is just noise. ",
              "They seemed very interested, really liked the preview and will let me know how they want to proceed. ",
              "They are a new non profit as well. ",
              "The biggest takeaway from that meeting was how I felt when I hung up the phone. ",
              "I was genuinely happy. ",
              "I really felt good having a skill that can help people, being able to answer questions honestly and not just trying to persuade someone to “buy my thing.” ",
              "I felt inspired by what they were doing and it was something I can see myself doing. ",
              "I'll update you when I have a response. "
          ]:
              cut(x)
          cut("Everything here can be extracted and moved — trees are in buried containers, most structures are built like movie props, and furniture and domes pack flat. ")
          cut("It moves like a circus or a Super Bowl halftime show. ")
          cut("Governments and political people always want a quick win, and with the proper alignment, many things become possible. ")
          cut("The sky is the limit, but now we are just barely getting out of the trenches. ")

          # Remove the whole stale client-oriented sentence rather than leaving broken grammar.
          cut("We designed these outreach boards to help ourselves and other clients in the future organize their campaigns. ")

          # Embedded tracker copy and branding.
          cut(" / Pauli")
          cut("Pauli/", required=False)
          cut(" and Pauli’s nonprofit capacity-building model", required=False)
          cut("We designed these outreach boards to help ourselves and other clients in the future organize their campaigns. ", required=False)

          # Dead Section 7 TOC item.
          s = re.sub(r"\n\s*\{ id: 'chapter-7', label: 'Recent Projects & Proposals', tag: 'Section 7' \},", "", s, count=1)

          # Dead project CSS.
          s, n = re.subn(
              r"\n/\* ═+\n   RECENT PROJECTS & PROPOSALS\n═+ \*/.*?(?=/\* ═+\n   RESPONSE SECTION)",
              "\n", s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'project css blocks removed={n}')
          s = re.sub(r"\n\.project-snapshot\.jetty-static\{.*?(?=\n\.funding-collapsible\{)", "\n", s, count=1, flags=re.S)
          s = re.sub(r"\n\.hero \.project-snapshot,\n\.hero \.project-snapshot-link,\n\.hero \[data-project-card\]\{\n  display:none!important;\n\}", "", s, count=1)
          s = s.replace('\n.project-card[data-project-card="project-4-jetty"] ', '\n')

          # Dead project JS.
          s, n = re.subn(
              r"\n/\* ══ RECENT PROJECT CARDS ═+ \*/\nfunction initProjectCards\(\)\{.*?\n\}\n\n(?=/\* ══ INIT)",
              "\n", s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'project js blocks removed={n}')
          s = s.replace('\ninitProjectCards();', '')

          # Remove only the two startup/investor-only tracker target objects.
          for target_id in ['ai-house-ai2-incubator-ecosystem', 'cascadia-capital-robotics-automation-ai-network']:
              pat = r"(?:, )?\{&quot;priority&quot;:[^{}]*?&quot;id&quot;: &quot;" + re.escape(target_id) + r"&quot;\}"
              s, n = re.subn(pat, '', s, count=1)
              if n != 1: raise SystemExit(f'{target_id} removed={n}')

          # Remove now-empty extra line break in Income Velocity.
          s = s.replace('Short answer: yes, of course. There is no shortage of companies that want to hire people that can use AI to help them scale.<br/><br/>\n      </div>',
                        'Short answer: yes, of course. There is no shortage of companies that want to hire people that can use AI to help them scale.</div>')

          p.write_text(s)
          PY

      - name: Verify tracker and reductions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          forbidden = [
            "chapter-7', label: 'Recent Projects & Proposals",
            "resources section at the end of this document",
            "I'm 47 now and 48 this year",
            "maximizing profits at any cost",
            "yesterday I met with my first potential client",
            "Governments and political people always want a quick win",
            "The sky is the limit",
            "NWKids / Pauli Funding Tracker",
            "Pauli/NWKids",
            "ai-house-ai2-incubator-ecosystem",
            "cascadia-capital-robotics-automation-ai-network",
            "function initProjectCards()",
            "RECENT PROJECTS & PROPOSALS"
          ]
          bad = [x for x in forbidden if x in s]
          if bad: raise SystemExit('Still present: ' + repr(bad))
          # Ensure the tracker was not accidentally collapsed.
          ids = s.count('&quot;id&quot;: &quot;')
          if ids < 25:
              raise SystemExit(f'Tracker target count unexpectedly low: {ids}')
          PY

      - name: Commit corrected reduction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-veronika-reduction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-veronika-reduction.yml
          git commit -m "fix: preserve tracker while reducing Veronika document"
          git push origin HEAD:main