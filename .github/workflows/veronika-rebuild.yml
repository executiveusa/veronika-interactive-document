name: Veronika Original Shell Recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild clean interactive document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          source=Path('veronika-strategic-briefing-final-full-v11-images-and-year-fonts.html').read_text(encoding='utf-8')
          end=s.find('</html>')
          if end<0: raise SystemExit('index.html has no closing html tag')
          s=s[:end+len('</html>')]
          a=source.find('<style>'); b=source.find('</style>',a)
          if a<0 or b<0: raise SystemExit('intact source stylesheet not found')
          style=source[a:b+len('</style>')]
          if '<style' not in s: s=s.replace('</head>',style+'\n</head>',1)
          s=s.replace('6..72','6.72')
          old='<section data-chapter="" id="chapter-1">\n<div class="chapter-block">\n<div class="section-tag">Section 7</div>'
          new='<section id="chapter-7" data-chapter class="recent-projects-section wide">\n<div class="chapter-block">\n<div class="section-tag">Section 7</div>'
          if old in s: s=s.replace(old,new,1)
          elif 'id="chapter-7"' not in s: raise SystemExit('could not locate Section 7 wrapper')
          chapters="""var CHAPTERS = [
            { id: 'hero', label: 'Introduction', tag: null },
            { id: 'qa-section', label: 'Q & A', tag: 'Part One' },
            { id: 'chapter-7', label: 'Recent Projects & Proposals', tag: 'Section 7' },
            { id: 'chapter-8', label: 'Funding Alignment Board', tag: 'Section 8' },
            { id: 'response-section', label: 'Your Response', tag: 'Your Voice' }
          ];"""
          s,count=re.subn(r"var CHAPTERS = \[.*?\];",chapters,s,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'expected one CHAPTERS array, replaced {count}')
          s=s.replace('New World Kids, , AI for Good','New World Kids, AI for Good')
          forbidden=['Jetty','veronika-jetty-second-brain','AI Second Brain','The Pauli Effect','SOURCE_FILE_REF:','id="chapter-1"','id="chapter-2"','id="chapter-3"','id="chapter-4"','id="chapter-5"','id="chapter-6"']
          required=['<style>','<section class="hero"','Veronika Dimitrov','id="chapter-7"','id="chapter-8"','id="response-section"','Funding Alignment Outreach Board']
          for token in forbidden:
            if token in s: raise SystemExit('forbidden token remains: '+token)
          for token in required:
            if token not in s: raise SystemExit('required token missing: '+token)
          if s.count('<style')!=1 or s.count('</style>')!=1: raise SystemExit('stylesheet count invalid')
          if s.count('</html>')!=1 or not s.rstrip().endswith('</html>'): raise SystemExit('document boundary invalid')
          if s.count('<script')!=1 or s.count('</script>')!=1: raise SystemExit('script count invalid')
          p.write_text(s,encoding='utf-8')
          print('bytes=',p.stat().st_size)
          print('sha256=',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit verified rebuild and remove recovery workflow
        shell: bash
        run: |
          rm .github/workflows/veronika-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/veronika-rebuild.yml
          git commit -m "fix: restore original Veronika interactive document shell"
          git push origin HEAD:main
