name: Remove stale Veronika sentence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove exact stale sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          needle = "I included a chapter in the back with examples of the offers we are making and previous projects I built and sold."
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 match, found {count}')
          path.write_text(text.replace(needle, '', 1))
          PY
      - name: Commit exact cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/remove-stale-veronika-sentence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-stale-veronika-sentence.yml
          git commit -m "chore: remove stale project-offers sentence"
          git push origin HEAD:main
